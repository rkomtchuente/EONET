# NOTE: the "eonet-secrets" env group is NOT defined here on purpose.
# Create it in the Render Dashboard (Env Groups -> New Environment Group)
# BEFORE syncing this Blueprint, with at least these keys:
#   POSTGRES_PASSWORD
#   AIRFLOW__DATABASE__SQL_ALCHEMY_CONN   (AIRFLOW__CORE__SQL_ALCHEMY_CONN on Airflow < 2.3)
#   AIRFLOW__CORE__FERNET_KEY
#   AIRFLOW__WEBSERVER__SECRET_KEY
#   _AIRFLOW_WWW_USER_PASSWORD            (Airflow admin login password; NOT the DB password)
# plus any API keys / DB settings that fastapi and your DAGs read.

envVarGroups:
  # Non-secret part of x-airflow-common
  - name: airflow-common
    envVars:
      - key: AIRFLOW__CORE__EXECUTOR
        value: LocalExecutor
      - key: AIRFLOW__CORE__LOAD_EXAMPLES
        value: "False"

services:
  - type: pserv
    name: postgres
    runtime: image
    image:
      url: docker.io/library/postgres:13
    plan: starter
    disk:
      name: postgres_data
      mountPath: /var/lib/postgresql/data
      sizeGB: 5
    envVars:
      - fromGroup: eonet-secrets
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_DB
        value: EONET
      - key: PGDATA
        value: /var/lib/postgresql/data/pgdata
      - key: PORT
        value: "5432"

  # airflow-init + airflow-webserver
  - type: web
    name: airflow-webserver
    runtime: docker
    plan: standard
    dockerfilePath: ./airflow/Dockerfile
    dockerContext: .
    # Render's dockerCommand replaces the image's ENTRYPOINT as well as CMD,
    # so call the official image's /entrypoint script explicitly. It runs the
    # DB migration and admin-user creation below, then starts the webserver.
    dockerCommand: /entrypoint webserver
    healthCheckPath: /health
    envVars:
      - fromGroup: airflow-common
      - fromGroup: eonet-secrets
      - key: PORT
        value: "8080"
      - key: _AIRFLOW_DB_MIGRATE        # use _AIRFLOW_DB_UPGRADE on Airflow < 2.7
        value: "true"
      - key: _AIRFLOW_WWW_USER_CREATE
        value: "true"
      - key: _AIRFLOW_WWW_USER_USERNAME
        value: admin

  - type: worker
    name: airflow-scheduler
    runtime: docker
    plan: standard
    dockerfilePath: ./airflow/Dockerfile
    dockerContext: .
    dockerCommand: /entrypoint scheduler
    envVars:
      - fromGroup: airflow-common
      - fromGroup: eonet-secrets

  - type: web
    name: fastapi
    runtime: docker
    plan: starter
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    envVars:
      - fromGroup: eonet-secrets
      - key: PORT
        value: "8000"
